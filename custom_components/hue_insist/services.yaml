save_state:
  name: Save state
  description: >-
    Stores the current state of light entities under a name, in memory. Groups
    are expanded to their individual lamps, so the restore keeps per-lamp
    brightness and colour instead of flattening a whole room to one value.
  fields:
    name:
      name: Name
      description: Label to store under. Saving again under the same name replaces it.
      required: true
      example: voor_deurbelflits
      selector:
        text:
    entity_id:
      name: Lights
      description: >-
        Which lights to capture. Leave empty for every light in the house;
        groups may be given and are expanded to their members.
      required: false
      selector:
        entity:
          multiple: true
          domain: light

restore_state:
  name: Restore state
  description: >-
    Puts the lights back the way a saved snapshot found them. Lamps that were
    off go off, lamps that were on get their brightness and colour back. Runs
    through light.turn_on and light.turn_off, so Hue Insist verifies the result
    per lamp like any other command.
  fields:
    name:
      name: Name
      description: Which snapshot to restore.
      required: true
      example: voor_deurbelflits
      selector:
        text:
    clear:
      name: Clear afterwards
      description: >-
        Drop the snapshot once restored. Turn this off to restore the same
        snapshot more than once.
      required: false
      default: true
      selector:
        boolean:

flash_lights:
  name: Flash lights
  description: >-
    Blinks lights for a set time by handing the whole sequence to the Hue
    bridge, which runs it itself. On a room or zone that is one request for the
    entire group, so every lamp blinks in step. The rhythm is the bridge's
    choice and cannot be set; only how long it lasts is yours. Lamps do not
    necessarily end up as they started, so pair this with save_state and
    restore_state when that matters.
  target:
    entity:
      domain:
        - light
        - scene
  fields:
    flash_duration:
      name: Duration
      description: >-
        How long to keep blinking, in milliseconds. The bridge rounds this to
        whole seconds.
      default: 3000
      selector:
        number: {min: 1000, max: 60000, step: 1000, unit_of_measurement: ms, mode: box}
